<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База відпочинку Маяк</title>
    <!-- Иконка вкладки сайта -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Подключаем Tailwind CSS для красивого и адаптивного дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Принудительная прокрутка в самый верх при загрузке -->
    <script>
        window.scrollTo(0, 0);
    </script>

    <!-- Шапка сайта -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="logo.png" alt="Логотип Маяк" class="w-10 h-10 object-contain rounded-full shadow">
                <div>
                    <h1 class="font-bold text-lg text-blue-900 leading-tight">МАЯК</h1>
                    <p class="text-xs text-slate-500 uppercase tracking-wider">База відпочинку</p>
                </div>
            </div>
            <nav class="hidden md:flex space-x-6 text-sm font-medium text-slate-600">
                <a href="#gallery" class="hover:text-blue-600 transition">Фото</a>
                <a href="#about" class="hover:text-blue-600 transition">Про нас</a>
                <a href="#contacts" class="hover:text-blue-600 transition">Контакти</a>
            </nav>
        </div>
    </header>

    <!-- Главный блок -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <section class="text-center py-12 bg-blue-900 text-white rounded-2xl mb-12 shadow-md">
            <h2 class="text-3xl md:text-4xl font-bold mb-4">Ласкаво просимо на базу відпочинку «Маяк»!</h2>
            <p class="text-blue-200 max-w-xl mx-auto text-lg px-4">Чудове місце для вашого незабутнього відпочинку біля моря.</p>
        </section>

        <!-- Галерея фотографий -->
        <section id="gallery" class="mb-16">
            <h3 class="text-2xl font-bold mb-6 text-slate-800 text-center">Фото нашої бази</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- Картинки с возможностью увеличения -->
                <div class="bg-white rounded-xl shadow overflow-hidden cursor-pointer transition transform hover:-translate-y-1 hover:shadow-lg" onclick="openModal('1.png')">
                    <img src="1.png" alt="Фото 1" class="w-full h-56 object-cover">
                </div>
                <div class="bg-white rounded-xl shadow overflow-hidden cursor-pointer transition transform hover:-translate-y-1 hover:shadow-lg" onclick="openModal('2.png')">
                    <img src="2.png" alt="Фото 2" class="w-full h-56 object-cover">
                </div>
                <div class="bg-white rounded-xl shadow overflow-hidden cursor-pointer transition transform hover:-translate-y-1 hover:shadow-lg" onclick="openModal('3.png')">
                    <img src="3.png" alt="Фото 3" class="w-full h-56 object-cover">
                </div>
                <div class="bg-white rounded-xl shadow overflow-hidden cursor-pointer transition transform hover:-translate-y-1 hover:shadow-lg" onclick="openModal('4.png')">
                    <img src="4.png" alt="Фото 4" class="w-full h-56 object-cover">
                </div>
                <div class="bg-white rounded-xl shadow overflow-hidden cursor-pointer transition transform hover:-translate-y-1 hover:shadow-lg" onclick="openModal('5.png')">
                    <img src="5.png" alt="Фото 5" class="w-full h-56 object-cover">
                </div>
                <div class="bg-white rounded-xl shadow overflow-hidden cursor-pointer transition transform hover:-translate-y-1 hover:shadow-lg" onclick="openModal('6.png')">
                    <img src="6.png" alt="Фото 6" class="w-full h-56 object-cover">
                </div>
            </div>
        </section>
    </main>

    <!-- Подвал сайта -->
    <footer id="contacts" class="bg-white border-t border-slate-200 py-8 text-center text-sm text-slate-500">
        <p>&copy; 2026 База відпочинку «Маяк». Усі права захищені.</p>
    </footer>

    <!-- Модальное окно для просмотра фото на весь экран -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-z-50 bg-opacity-90 hidden items-center justify-center p-4 z-50" onclick="closeModal()">
        <div class="relative max-w-4xl max-h-full">
            <button class="absolute -top-10 right-0 text-white text-3xl font-bold hover:text-slate-300">&times;</button>
            <img id="modalImage" src="" alt="Повний розмір" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain mx-auto">
        </div>
    </div>

    <!-- Скрипты для модального окна -->
    <script>
        function openModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            modalImage.src = imageSrc;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }
    </script>
</body>
</html>
