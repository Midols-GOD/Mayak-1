<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База відпочинку «Маяк» — Бронювання</title>
    <!-- Подключаем Tailwind CSS для красивого стильного интерфейса -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем библиотеку Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <div class="max-w-4xl mx-auto p-6 w-full">
        <!-- Шапка сайта -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900">База відпочинку «Маяк»</h1>
            <p class="text-slate-600 mt-2">Одеська область — Обирайте дати та бронюйте відпочинок</p>
        </header>

        <!-- Основная форма бронирования -->
        <main class="bg-white rounded-2xl shadow-xl p-6 md:p-8">
            <form id="booking-form" class="space-y-6">
                
                <!-- Выбор типа номера -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Оберіть тип номеру / будиночка</label>
                    <select id="room-type" class="w-full rounded-xl border border-slate-300 p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="Стандарт">Стандартний номер</option>
                        <option value="Комфорт">Номер Комфорт</option>
                        <option value="Котедж">Окремий котедж</option>
                    </select>
                </div>

                <!-- Даты заезда и выезда -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Дата заїзду</label>
                        <input type="date" id="start-date" required class="w-full rounded-xl border border-slate-300 p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Дата виїзду</label>
                        <input type="date" id="end-date" required class="w-full rounded-xl border border-slate-300 p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <!-- Контактные данные гостя -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Ваше ім'я</label>
                        <input type="text" id="guest-name" placeholder="Введіть ім'я" required class="w-full rounded-xl border border-slate-300 p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Номер телефону</label>
                        <input type="tel" id="guest-phone" placeholder="+38 (0XX) XXX-XX-XX" required class="w-full rounded-xl border border-slate-300 p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <!-- Блок расчета цены -->
                <div class="bg-blue-50 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-center text-slate-700">
                    <div>
                        <span class="text-sm">Загальна вартість: <strong id="total-price-text" class="text-xl text-blue-600">0</strong> грн</span>
                    </div>
                    <div class="mt-2 sm:mt-0">
                        <span class="text-sm">Переплата (аванс): <strong id="prepay-price-text" class="text-lg text-slate-800">0</strong> грн</span>
                    </div>
                </div>

                <!-- Кнопка отправки -->
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition duration-200 shadow-lg">
                    Забронювати відпочинок
                </button>
            </form>
        </main>
    </div>

    <!-- Футер -->
    <footer class="text-center py-6 text-sm text-slate-500">
        &copy; 2026 База відпочинку «Маяк». Всі права захищені.
    </footer>

    <!-- Логика работы скрипта и связи с Supabase -->
    <script>
        // Инициализация Supabase
        const SUPABASE_URL = 'https://ayemtrpizbzfpylzefhh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QPxXpSn4wzYoaQFBUTepyw_xUO-k0Re';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Простой расчет стоимости при изменении дат или типа номера
        const roomTypeSelect = document.getElementById('room-type');
        const startDateInput = document.getElementById('start-date');
        const endDateInput = document.getElementById('end-date');
        const totalPriceText = document.getElementById('total-price-text');
        const prepayPriceText = document.getElementById('prepay-price-text');

        function calculatePrice() {
            const start = new Date(startDateInput.value);
            const end = new Date(endDateInput.value);

            if (start && end && end > start) {
                const days = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
                
                // Базовые цены за сутки в зависимости от типа номера
                let pricePerDay = 1000;
                if (roomTypeSelect.value === 'Комфорт') pricePerDay = 1500;
                if (roomTypeSelect.value === 'Котедж') pricePerDay = 2500;

                const total = days * pricePerDay;
                const prepay = Math.round(total * 0.3); // Предоплата 30%

                totalPriceText.textContent = total;
                prepayPriceText.textContent = prepay;
            } else {
                totalPriceText.textContent = '0';
                prepayPriceText.textContent = '0';
            }
        }

        roomTypeSelect.addEventListener('change', calculatePrice);
        startDateInput.addEventListener('change', calculatePrice);
        endDateInput.addEventListener('change', calculatePrice);

        // Обработка отправки формы
        document.getElementById('booking-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const start = new Date(startDateInput.value);
            const end = new Date(endDateInput.value);
            if (end <= start) {
                alert('Дата виїзду має бути пізнішою за дату заїзду!');
                return;
            }

            const days = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
            let pricePerDay = 1000;
            if (roomTypeSelect.value === 'Комфорт') pricePerDay = 1500;
            if (roomTypeSelect.value === 'Котедж') pricePerDay = 2500;
            
            const total = days * pricePerDay;
            const prepay = Math.round(total * 0.3);

            const bookingData = {
                room_type: roomTypeSelect.value,
                start_date: startDateInput.value,
                end_date: endDateInput.value,
                guest_name: document.getElementById('guest-name').value,
                guest_phone: document.getElementById('guest-phone').value,
                total_price: total,
                prepay_price: prepay,
                status: 'new'
            };

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Обробка замовлення...';

            try {
                const { data, error } = await supabase
                    .from('bookings')
                    .insert([bookingData]);

                if (error) {
                    console.error('Помилка Supabase:', error.message);
                    alert('Сталася помилка під час бронювання. Спробуйте ще раз.');
                } else {
                    alert('Вітаємо! Ваше бронювання успішно створено та збережено в базі даних.');
                    document.getElementById('booking-form').reset();
                    totalPriceText.textContent = '0';
                    prepayPriceText.textContent = '0';
                }
            } catch (err) {
                console.error('Помилка мережі:', err);
                alert('Помилка з'єднання з базою даних.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Забронювати відпочинок';
            }
        });
    </script>
</body>
</html>
